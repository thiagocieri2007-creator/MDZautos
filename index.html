<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MDZ Autos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAV — se oculta en el splash -->
    <nav id="nav">
        <div class="nav-content">
            <a href="#home" class="nav-logo">
                <img src="logo.png" alt="MDZ" class="nav-logo-img" onerror="this.style.display='none'">
                <span id="dealership-name" class="nav-logo-text">MDZ</span>
            </a>
            <ul>
                <li><a href="#catalog" class="nav-link">Catálogo</a></li>
                <li><a href="#comparar" class="nav-link">Comparar</a></li>
            </ul>
        </div>
    </nav>

    <main id="main"></main>

    <!-- Lightbox global -->
    <div id="lightbox" class="lightbox" style="display:none">
        <div class="lightbox-backdrop" onclick="closeLightbox()"></div>
        <button class="lightbox-close" onclick="closeLightbox()"></button>
        <button class="lightbox-prev" onclick="lightboxNav(-1)">‹</button>
        <img id="lightbox-img" src="" alt="">
        <button class="lightbox-next" onclick="lightboxNav(1)">›</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
